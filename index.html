<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Wettbüro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1020; --bg2:#0f1729; --card:#141e33; --card2:#1a2640; --line:rgba(255,255,255,.07);
  --tx:#e9eef8; --mut:#8693ad; --dim:#56627c;
  --ice:#5ad1ff; --ice2:#2a9fd6; --win:#b4f461; --loss:#ff5d73; --gold:#ffc94a; --silver:#c6d2e6; --bronze:#e59a5c;
  --r:18px; --cond:'Barlow Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom));min-height:100vh;
  background:radial-gradient(120% 60% at 50% -10%,#16305a 0%,rgba(10,16,32,0) 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-family:var(--cond);font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px}
.logo{font-family:var(--cond);font-weight:800;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo i{width:21px;height:21px;border-radius:6px;background:var(--ice);display:grid;place-items:center;color:#06263a;font-style:normal;font-size:12px;transform:rotate(-8deg)}
.me{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:3px 10px 3px 3px;border-radius:99px}
.me b{font-family:var(--cond);font-size:16px}
h1{font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.5px;text-transform:uppercase;padding:2px 14px 8px;line-height:1}
h1 small{display:block;font:500 11.5px Inter;color:var(--mut);text-transform:none;letter-spacing:0;margin-top:6px}
main{padding:0 10px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:7px;display:flex;justify-content:space-between}

/* Avatare */
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px Inter;color:#0a1020;flex:none}
.av.s{width:22px;height:22px;font-size:9.5px}
.av.l{width:40px;height:40px;font-size:14px}
.people{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut);min-width:44px}
.person .av{width:34px;height:34px;font-size:12px;opacity:.5;transition:.15s}
.person.on{color:var(--tx);font-weight:600}
.person.on .av{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ice)}

textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:8px 10px;font:500 14px Inter;min-height:40px;resize:none;outline:none}
textarea:focus,input:focus{border-color:var(--ice)}
textarea::placeholder{color:var(--dim)}
.stakes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stake{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:4px 0 3px;font-family:var(--cond);font-weight:700;font-size:16px;text-align:center;transition:.12s}
.stake small{display:none}
.stake.on{background:var(--ice);color:#06263a;border-color:var(--ice)}
.stake.on small{color:#0b4664}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:500;color:var(--mut)}
.pill.on{color:#06263a;background:var(--ice);border-color:var(--ice);font-weight:600}
.dlrow{display:flex;gap:6px;align-items:center}.dlclr{width:32px;height:32px;flex:none;border-radius:9px;background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:12px}
input[type=datetime-local]{width:100%;margin-top:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:8px 10px;font:500 13px Inter;color-scheme:dark;outline:none}
.note{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:6px;align-items:center}
.cta{width:100%;margin:2px 0 4px;padding:9px;border-radius:11px;background:var(--ice);color:#06263a;font:800 15px var(--cond);letter-spacing:1.5px;text-transform:uppercase}
.cta:disabled{opacity:.5}
.err{color:var(--loss);font-size:13px;text-align:center;min-height:18px;margin-top:6px}

/* Wettschein */
.tk{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;position:relative}
.tk-top{padding:10px 12px 8px}
.tk-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.tk-meta .id{font-family:var(--cond);font-weight:700;font-size:13px;color:var(--dim)}
.tk h3{font-size:15px;font-weight:700;line-height:1.3;margin:6px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.chip.stk{color:var(--ice);background:rgba(90,209,255,.1)}
.chip.ok{color:var(--win);background:rgba(180,244,97,.1)}
.chip.bad{color:var(--loss);background:rgba(255,93,115,.1)}
.chip.gold{color:var(--gold);background:rgba(255,201,74,.12)}
.perf{height:0;border-top:1.5px dashed var(--line);margin:0 12px;position:relative}
.perf:before,.perf:after{content:'';position:absolute;top:-7px;width:13px;height:13px;border-radius:50%;background:var(--bg)}
.perf:before{left:-19px}.perf:after{right:-19px}
.tk-bot{padding:7px 12px 10px}
.deal{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.deal span{flex:1;font-weight:500}
.deal time{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.x{width:20px;height:20px;font-size:10px;border-radius:50%;background:rgba(255,93,115,.12);color:var(--loss);font-size:14px;line-height:1}
.empty{color:var(--dim);font-size:12.5px;padding:2px 0}
.result{margin:2px 0 8px;padding:8px 10px;border-radius:11px;background:linear-gradient(135deg,rgba(180,244,97,.13),rgba(180,244,97,.03));border:1px solid rgba(180,244,97,.18)}
.result.void{background:var(--card2);border-color:var(--line)}
.result b{font:800 16px var(--cond);letter-spacing:.8px;text-transform:uppercase;color:var(--win)}
.result.void b{color:var(--mut)}
.result p{font-size:11px;color:var(--mut);margin-top:2px}
.bil{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.adm{display:flex;gap:6px;margin-top:8px}
.adm button{flex:1;padding:7px;border-radius:10px;background:var(--card2);font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line)}
.tk.arch .tk-top{padding-bottom:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px;margin:0 0 8px}
.seg button{flex:1;padding:6px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx)}

/* Rangliste */
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:6px;margin:4px 0 10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px}
.pod .name{font-weight:600;font-size:12px}
.pod .num{font-size:17px}
.block{width:100%;border-radius:10px 10px 4px 4px;display:grid;place-items:center;font:800 20px var(--cond);color:rgba(10,16,32,.75)}
.p1 .block{height:52px;background:linear-gradient(180deg,var(--gold),#d99a19)}
.p2 .block{height:38px;background:linear-gradient(180deg,var(--silver),#8e9bb3)}
.p3 .block{height:28px;background:linear-gradient(180deg,var(--bronze),#a9622e)}
.p1 .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.crown{font-size:15px;margin-bottom:-3px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rw{display:flex;align-items:center;gap:9px;padding:7px 12px;border-top:1px solid var(--line);position:relative}
.rw:first-child{border-top:0}
.rw.mine{background:rgba(90,209,255,.06)}
.rk{width:16px;font:700 14px var(--cond);color:var(--dim);text-align:center}
.rw .who{flex:1;min-width:0}
.rw .who b{font-weight:600;display:block;font-size:13.5px}
.rw .who small{font-size:10.5px;color:var(--mut)}
.rw .num{font-size:18px;text-align:right}
.bar{position:absolute;left:0;bottom:0;height:2px;border-radius:2px}
.pos{color:var(--win)} .neg{color:var(--loss)}
.danger{width:100%;margin-top:10px;padding:10px;border-radius:12px;font-size:13px;border:1px solid rgba(255,93,115,.35);color:var(--loss);font-weight:600}

/* Navigation */
nav{position:fixed;left:8px;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));display:flex;background:rgba(20,30,51,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:3px;z-index:9}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;border-radius:12px;font-size:10px;font-weight:600;color:var(--dim);position:relative}
nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ice);background:rgba(90,209,255,.1)}
nav .badge{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--loss);color:#fff;font-size:10px;display:grid;place-items:center}
.center{text-align:center;color:var(--mut);padding:40px 20px;font-size:13px}
.reg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.reg .person .av{opacity:1}
.reg .person:disabled{opacity:.3}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
.anim>*{animation:pop .25s ease both}

.tk{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;padding:8px 10px}
.tk-meta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.tk-meta b{color:var(--tx);font-size:12px}
.tk-meta .id{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:12px;color:var(--dim)}
.ib{width:24px;height:24px;border-radius:7px;background:var(--card2);font-size:12px;color:var(--mut);flex:none}
.tk h3{font-size:14px;font-weight:600;line-height:1.3;margin:4px 0 5px}
.chip{font-size:10.5px;padding:2px 7px}
.dl{display:flex;gap:6px;align-items:flex-start;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.dlab{font:800 12px var(--cond);color:var(--ice);background:rgba(90,209,255,.1);border-radius:5px;padding:1px 5px;flex:none;margin-top:1px}
.dcs{display:flex;flex-wrap:wrap;gap:4px}
.dc{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:99px;padding:2px 4px 2px 8px;font-size:11.5px;font-weight:500}
.dc time{color:var(--mut);font-size:10.5px;font-weight:400;padding-right:4px}
.dx{width:16px;height:16px;border-radius:50%;background:rgba(255,93,115,.15);color:var(--loss);font-size:9px;line-height:1;margin-left:-2px}
.tk .empty{font-size:11.5px;padding:1px 0}
.tk .bil{margin-top:5px;gap:4px}
.tk.winW{border:3px solid var(--ice);box-shadow:0 0 0 3px rgba(90,209,255,.08)}
.tk.winD{border:3px solid var(--gold);box-shadow:0 0 0 3px rgba(255,201,74,.08)}
.amt{display:inline-block;font:700 12px Inter;color:var(--ice);background:rgba(90,209,255,.1);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.chips.one,.dcs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.one::-webkit-scrollbar,.dcs::-webkit-scrollbar{display:none}
.chips.one .chip,.dc{flex:none;white-space:nowrap}
.chips.one .chip{font-size:10px;padding:2px 6px;gap:3px}
.dc{font-size:11px;padding:2px 3px 2px 7px}
.dl{align-items:center}
.dnames{font-size:11px;font-weight:500;margin-top:4px;line-height:1.35}
.ib.on{background:var(--ice);color:#06263a}
.info{margin-top:6px;padding:6px 8px;border-radius:9px;background:var(--bg2);font-size:11.5px}
.info div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.info time{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.schein{padding-bottom:64px}
.slip{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ice);border-radius:5px 12px 12px 5px;padding:8px 10px 9px;margin-bottom:7px}
.sh{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.nb{width:18px;height:18px;border-radius:6px;background:var(--ice);color:#06263a;display:grid;place-items:center;font:800 12px var(--cond);letter-spacing:0}
.sx{margin-left:auto;width:20px;height:20px;border-radius:50%;background:rgba(255,93,115,.15);color:var(--loss);font-size:10px}
.slip textarea{min-height:34px;padding:7px 9px;margin-bottom:7px;font-size:14px;overflow:hidden}
.slip .stake.on{box-shadow:0 4px 12px -4px var(--ice)}
.add{width:100%;border:1.5px dashed rgba(90,209,255,.4);border-radius:12px;padding:8px;color:var(--ice);font-size:13px;font-weight:600;margin-bottom:7px}
.sumbar{position:fixed;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;background:rgba(20,30,51,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:7px 8px 7px 12px;z-index:8}
.sum{flex:1;font-size:11px;color:var(--mut);line-height:1.2}
.sum b{display:block;color:var(--tx);font:800 18px var(--cond);letter-spacing:.5px}
.sumbar .cta{width:auto;margin:0;padding:10px 18px}
</style>
</head>
<body>
<div id="app"><div class="center">Lädt …</div></div>

<script>
/* ↓↓↓ HIER DEINE APPS-SCRIPT-URL EINTRAGEN (endet auf /exec) ↓↓↓ */
const API = 'https://script.google.com/macros/s/AKfycbxv6L1wSMgpDIiTOjZCBieFW6Puk_g5rEzK7QPW03z1nNgj9oZr74VWNzxxS1m3nySZPw/exec';
/* ↑↑↑ */

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0a1020'); tg.setBackgroundColor('#0a1020'); } catch (e) {} }
const S = { tab: 'neu', d: null, ersteller: null, einsatz: null, dl: 'keine', dlEigen: '', text: '', archivFilter: 'alle' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chf = (n, vz) => { const a = String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, "'"); return (n < 0 ? '−' : vz && n > 0 ? '+' : '') + a; };
const haptic = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const tap = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const TZ = 'Europe/Zurich';
const f = (ts, o) => new Intl.DateTimeFormat('de-CH', Object.assign({ timeZone: TZ }, o)).format(new Date(ts));
const zeit = ts => f(ts, { hour: '2-digit', minute: '2-digit' });
const tag = ts => { const h = f(Date.now(), { day: '2-digit', month: '2-digit' }), d = f(ts, { day: '2-digit', month: '2-digit' });
  const g = f(Date.now() - 864e5, { day: '2-digit', month: '2-digit' }), m = f(Date.now() + 864e5, { day: '2-digit', month: '2-digit' });
  return d === h ? 'heute' : d === g ? 'gestern' : d === m ? 'morgen' : f(ts, { weekday: 'short' }) + ' ' + d; };
const wann = ts => tag(ts) + ' ' + zeit(ts);
const rest = ts => { let m = Math.round((ts - Date.now()) / 6e4); if (m <= 0) return null; const h = Math.floor(m / 60); m %= 60;
  return h >= 24 ? Math.floor(h / 24) + ' T ' + (h % 24) + ' h' : h ? h + ' h ' + m + ' min' : m + ' min'; };
const FARBEN = ['#5ad1ff', '#b4f461', '#ffc94a', '#ff8fa3', '#b49cff', '#5ef0c2', '#ffa95a', '#7aa8ff', '#f78cff'];
const farbe = n => FARBEN[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % FARBEN.length];
const av = (n, k) => '<div class="av ' + (k || '') + '" style="background:' + farbe(n) + '">' + esc(n.slice(0, 2)) + '</div>';
const icon = { neu: '<path d="M12 5v14M5 12h14"/>', lauf: '<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/>',
  arch: '<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/>',
  rang: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/>' };

async function call(action, extra) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : '' }, extra || {})) });
  return r.json();
}
async function load() {
  try { const d = await call('init', { base: location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '') }); if (!d.ok) return fehler(d.error); setze(d); }
  catch (e) { fehler('Keine Verbindung zum Server.'); }
}
function setze(d) { S.d = d; if (!S.ersteller) S.ersteller = d.ich; render(); }
function fehler(t) { $('#app').innerHTML = '<div class="center">⚠️<br><br>' + esc(t) + '</div>'; }
function bestaetigen(t, fn) { tg && tg.showConfirm ? tg.showConfirm(t, y => y && fn()) : confirm(t) && fn(); }
async function admin(action, extra, frage) {
  const go = async () => { const r = await call(action, extra); if (!r.ok) { haptic('error'); return tg ? tg.showAlert(r.error) : alert(r.error); } haptic('success'); setze(r); };
  frage ? bestaetigen(frage, go) : go();
}

/* ---------- Rahmen ---------- */
function render() {
  const d = S.d;
  if (!d.ich) return renderRegister();
  const mein = d.tabelle.find(s => s.name === d.ich) || { saldo: 0 };
  const offen = d.laufend.filter(w => w.status === 'offen').length;
  const tabs = [['neu', 'Neu', icon.neu], ['lauf', 'Laufend', icon.lauf, offen], ['arch', 'Archiv', icon.arch], ['rang', 'Rangliste', icon.rang]];
  $('#app').innerHTML =
    '<header><div class="logo"><i>🎲</i>Wettbüro</div><div class="me">' + av(d.ich, 's') +
      '<b class="' + (mein.saldo >= 0 ? 'pos' : 'neg') + '">' + chf(mein.saldo, true) + '</b></div></header>' +
    '<div id="view" class="anim">' + ({ neu: viewNeu, lauf: viewLauf, arch: viewArch, rang: viewRang })[S.tab]() + '</div>' +
    '<nav>' + tabs.map(t => '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '"><svg viewBox="0 0 24 24">' + t[2] + '</svg>' + t[1] +
      (t[3] ? '<span class="badge">' + t[3] + '</span>' : '') + '</button>').join('') + '</nav>';
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { if (S.tab === 'neu') merke(); S.tab = b.dataset.tab; tap(); render(); scrollTo(0, 0); });
  ({ neu: bindNeu, lauf: bindListe, arch: bindListe, rang: bindRang })[S.tab]();
}

function renderRegister() {
  const d = S.d;
  $('#app').innerHTML = '<header><div class="logo"><i>🎲</i>Wettbüro</div></header><h1>Wer bist du?<small>Nur einmal nötig – danach erkennt dich die App automatisch.</small></h1>' +
    '<main><div class="sec"><div class="reg">' + d.namen.map(n => '<button class="person" data-n="' + esc(n) + '"' + (d.frei.indexOf(n) < 0 ? ' disabled' : '') + '>' + av(n) + esc(n) + '</button>').join('') +
    '</div></div><div class="err" id="err"></div></main>';
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => bestaetigen('Bist du ' + b.dataset.n + '?', async () => {
    const r = await call('register', { name: b.dataset.n });
    if (!r.ok) return ($('#err').textContent = r.error);
    haptic('success'); S.ersteller = r.ich; setze(r);
  }));
}

/* ---------- Wettschein (mehrere Wetten) ---------- */
function dlWert() { return S.dlEigen ? new Date(S.dlEigen) : null; }
function slip() { if (!S.slip) S.slip = [{ text: '', einsatz: null }]; return S.slip; }
function viewNeu() {
  const d = S.d, sl = slip(), dl = dlWert();
  const total = sl.reduce((a, x) => a + (x.einsatz || 0), 0);
  return '<h1>Wettschein</h1><main class="schein">' +
    sl.map((x, i) => '<div class="slip"><div class="sh"><span class="nb">' + (i + 1) + '</span>Wette' +
      (sl.length > 1 ? '<button class="sx" data-del="' + i + '" aria-label="Wette entfernen">✕</button>' : '') + '</div>' +
      '<textarea data-t="' + i + '" maxlength="200" rows="1">' + esc(x.text) + '</textarea>' +
      '<div class="stakes">' + d.einsaetze.map(e => '<button class="stake' + (x.einsatz === e ? ' on' : '') + '" data-x="' + i + '|' + e + '">' + e + '</button>').join('') + '</div></div>').join('') +
    (sl.length < 10 ? '<button class="add" id="add">＋ Weitere Wette</button>' : '') +
    '<div class="sec"><div class="lbl">Deadline · für alle <span>freiwillig</span></div>' +
      '<div class="dlrow"><input type="datetime-local" id="dlx" value="' + esc(S.dlEigen) + '">' +
      (S.dlEigen ? '<button class="dlclr" id="dlclr" aria-label="Deadline entfernen">✕</button>' : '') + '</div>' +
      (dl ? '<div class="note">🔒 Ab ' + wann(dl.getTime()) + ' keine Deals mehr.</div>' : '') + '</div>' +
    '<div class="err" id="err"></div></main>' +
    '<div class="sumbar"><div class="sum">' + sl.length + (sl.length === 1 ? ' Wette' : ' Wetten') + '<b>' + chf(total) + ' CHF</b></div>' +
    '<button class="cta" id="go">Platzieren</button></div>';
}
function merke() {
  document.querySelectorAll('[data-t]').forEach(t => { slip()[Number(t.dataset.t)].text = t.value; });
  const x = $('#dlx'); if (x) S.dlEigen = x.value;
}
function bindNeu() {
  const re = () => { tap(); const y = scrollY; render(); scrollTo(0, y); };
  document.querySelectorAll('[data-t]').forEach(t => { const fit = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }; fit(); t.oninput = fit; });
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { merke(); const [i, e] = b.dataset.x.split('|'); slip()[Number(i)].einsatz = Number(e); re(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { merke(); slip().splice(Number(b.dataset.del), 1); re(); });
  const add = $('#add'); if (add) add.onclick = () => { merke(); slip().push({ text: '', einsatz: null }); re(); const t = document.querySelectorAll('[data-t]'); t[t.length - 1].focus(); };
  $('#dlx').onchange = () => { merke(); re(); };
  const c = $('#dlclr'); if (c) c.onclick = () => { merke(); S.dlEigen = ''; re(); };
  $('#go').onclick = senden;
}
async function senden() {
  merke();
  const err = t => { $('#err').textContent = t; haptic('error'); };
  const sl = slip(), dl = dlWert();
  for (let i = 0; i < sl.length; i++) {
    const nr = sl.length > 1 ? ' (Wette ' + (i + 1) + ')' : '';
    if (!sl[i].text.trim()) return err('Bitte die Wette eingeben' + nr + '.');
    if (!sl[i].einsatz) return err('Bitte einen Einsatz wählen' + nr + '.');
  }
  if (dl && dl <= new Date()) return err('Die Deadline liegt in der Vergangenheit.');
  const b = $('#go'); b.disabled = true; b.textContent = '…';
  try {
    const r = await call('create', { wetten: sl.map(x => ({ text: x.text.trim(), einsatz: x.einsatz })), deadline: dl ? dl.toISOString() : '' });
    if (!r.ok) { b.disabled = false; b.textContent = 'Platzieren'; return err(r.error); }
    haptic('success'); S.slip = null; S.dlEigen = '';
    const n = (r.ids || [r.id]).length;
    tg && tg.showAlert ? tg.showAlert('✅ ' + (n === 1 ? 'Wette ist' : n + ' Wetten sind') + ' im Wettbüro!', () => tg.close()) : load();
  } catch (e) { b.disabled = false; b.textContent = 'Platzieren'; err('Keine Verbindung. Nochmals versuchen.'); }
}

/* ---------- Wettscheine (kompakt) ---------- */
function ticket(w, imArchiv) {
  const d = S.d, A = d.admin;
  let meta = '';
  if (w.status === 'offen' && w.deadline) {
    const r = rest(w.deadline);
    meta += r ? '<span class="chip gold">⏰ ' + r + '</span>' : '<span class="chip bad">🔒 Deadline vorbei</span>';
  }
  if (w.status === 'entschieden') {
    const wp = w.bilanz.find(x => x.name === w.ersteller) || { betrag: 0 }, n = w.deals.length, je = n ? -wp.betrag / n : 0;
    meta += '<span class="chip ' + (w.gewinner === 'E' ? 'stk' : 'gold') + '">🏆 ' + (w.gewinner === 'E' ? 'W' : 'D') + ' gewinnt</span>' +
      '<span class="chip ' + (wp.betrag >= 0 ? 'ok' : 'bad') + '">' + esc(w.ersteller) + ' ' + chf(wp.betrag, true) + '</span>' +
      '<span class="chip ' + (je >= 0 ? 'ok' : 'bad') + '">' + (n === 1 ? esc(w.deals[0].name) + ' ' : 'D je ') + chf(je, true) + '</span>';
    if (n > 1) meta += '</div><div class="dnames ' + (je >= 0 ? 'pos' : 'neg') + '">' + w.deals.map(x => esc(x.name)).join(' · ');
  }
  if (w.status === 'storniert') meta += '<span class="chip">storniert</span>';
  let tools = '<button class="ib' + (S.info === w.id ? ' on' : '') + '" data-info="' + w.id + '" aria-label="Info">ℹ️</button>';
  if (A) {
    if (w.status !== 'offen') tools += '<button class="ib" data-undo="' + w.id + '" aria-label="' + (imArchiv ? 'Zurückholen' : 'Rückgängig') + '">↩︎</button>';
    if (!imArchiv) tools += '<button class="ib" data-arch="' + w.id + '" data-leer="' + (w.deals.length ? '' : '1') + '" aria-label="Entfernen">' + (w.status !== 'offen' ? '📦' : w.deals.length ? '📦' : '🗑️') + '</button>';
  }
  const deals = w.deals.length ? w.deals.map(x => '<span class="dc">' + esc(x.name) +
      (A && !imArchiv ? '<button class="dx" data-weg="' + w.id + '|' + esc(x.name) + '" aria-label="Deal löschen">✕</button>' : '') + '</span>').join('')
    : '<span class="empty">' + (imArchiv ? 'keine Deals' : 'noch keine Deals') + '</span>';
  const bil = w.status === 'entschieden' ? '<div class="bil">' + w.bilanz.map(x => '<span class="chip ' + (x.betrag >= 0 ? 'ok' : 'bad') + '">' + esc(x.name) + ' ' + chf(x.betrag, true) + '</span>').join('') + '</div>' : '';
  return '<div class="tk' + (w.status === 'entschieden' ? (w.gewinner === 'E' ? ' winW' : ' winD') : '') + '"><div class="tk-meta">' + av(w.ersteller, 's') + '<b>' + esc(w.ersteller) + '</b><span>' + wann(w.erstellt) + '</span>' +
    '<span class="id">#' + w.id + '</span>' + tools + '</div>' +
    '<h3>' + esc(w.text) + ' <span class="amt">' + w.einsatz + ' CHF</span></h3>' + (meta ? '<div class="chips one">' + meta + '</div>' : '') +
    (w.status === 'entschieden' ? '' : '<div class="dl"><span class="dlab">D</span><div class="dcs">' + deals + '</div></div>') +
    (S.info === w.id ? '<div class="info"><div><span>Erstellt</span><time>' + wann(w.erstellt) + '</time></div>' +
      (w.deadline ? '<div><span>Deadline</span><time>' + wann(w.deadline) + '</time></div>' : '') +
      (w.deals.length ? w.deals.map(x => '<div><span>🤝 ' + esc(x.name) + '</span><time>' + wann(x.zeit) + '</time></div>').join('') : '<div><span>Noch keine Deals</span></div>') +
      (w.entschieden ? '<div><span>✅ eingetragen von ' + esc(w.entschiedenVon) + '</span><time>' + wann(w.entschieden) + '</time></div>' : '') + '</div>' : '') + '</div>';
}
function viewLauf() {
  const l = S.d.laufend;
  return '<h1>Laufend<small>' + l.filter(w => w.status === 'offen').length + ' offen</small></h1><main>' +
    (l.length ? l.map(w => ticket(w, false)).join('') : '<div class="center">Gerade keine Wetten.<br>Zeit für eine neue? 🎲</div>') + '</main>';
}
function viewArch() {
  const d = S.d, mine = S.archivFilter === 'mine';
  const l = d.archiv.filter(w => !mine || w.ersteller === d.ich || w.deals.some(x => x.name === d.ich));
  return '<h1>Archiv</h1><main><div class="seg">' +
    [['alle', 'Alle'], ['mine', 'Nur meine']].map(o => '<button data-f="' + o[0] + '" class="' + (S.archivFilter === o[0] ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div>' +
    (l.length ? l.map(w => ticket(w, true)).join('') : '<div class="center">Noch nichts im Archiv.</div>') + '</main>';
}
function bindListe() {
  document.querySelectorAll('[data-info]').forEach(b => b.onclick = () => { const id = Number(b.dataset.info); S.info = S.info === id ? null : id; tap(); const y = scrollY; render(); scrollTo(0, y); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.archivFilter = b.dataset.f; tap(); render(); });
  document.querySelectorAll('[data-weg]').forEach(b => b.onclick = () => { const [id, n] = b.dataset.weg.split('|'); admin('dealWeg', { id, name: n }, 'Deal von ' + n + ' bei Wette #' + id + ' löschen?'); });
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => admin('undo', { id: b.dataset.undo }, 'Wette #' + b.dataset.undo + ' wieder öffnen? Das Ergebnis wird entfernt.'));
  document.querySelectorAll('[data-arch]').forEach(b => b.onclick = () => admin('arch', { id: b.dataset.arch }, b.dataset.leer ? 'Wette #' + b.dataset.arch + ' komplett löschen? Sie verschwindet überall.' : 'Wette #' + b.dataset.arch + ' jetzt ins Archiv? Offene Wetten werden storniert.'));
}

/* ---------- Rangliste ---------- */
function viewRang() {
  const d = S.d, t = d.tabelle, max = Math.max(1, ...t.map(s => Math.abs(s.saldo)));
  const pod = (s, k, platz) => s ? '<div class="pod ' + k + '">' + (platz === 1 ? '<div class="crown">👑</div>' : '') + av(s.name, 'l') +
    '<div class="name">' + esc(s.name) + '</div><div class="num ' + (s.saldo >= 0 ? 'pos' : 'neg') + '">' + chf(s.saldo, true) + '</div><div class="block">' + platz + '</div></div>' : '<div></div>';
  return '<h1>Rangliste<small>Saldo in CHF · W = Wetten · D = Deals</small></h1><main>' +
    '<div class="podium">' + pod(t[1], 'p2', 2) + pod(t[0], 'p1', 1) + pod(t[2], 'p3', 3) + '</div>' +
    '<div class="rows">' + t.map((s, i) => '<div class="rw' + (s.name === d.ich ? ' mine' : '') + '"><div class="rk">' + (i + 1) + '</div>' + av(s.name) +
      '<div class="who"><b>' + esc(s.name) + '</b><small>' + s.wetten + ' W · ' + s.deals + ' D</small></div>' +
      '<div class="num ' + (s.saldo >= 0 ? 'pos' : 'neg') + '">' + chf(s.saldo, true) + '</div>' +
      '<div class="bar" style="width:' + Math.round(Math.abs(s.saldo) / max * 100) + '%;background:var(--' + (s.saldo >= 0 ? 'win' : 'loss') + ');opacity:.5"></div></div>').join('') + '</div>' +
    (d.admin ? '<div class="sec" style="margin-top:14px"><div class="lbl">Anmeldungen <span>' + d.angemeldet.length + ' / ' + d.namen.length + '</span></div>' +
      d.namen.map(n => '<div class="deal">' + av(n, 's') + '<span>' + esc(n) + '</span>' +
        (d.angemeldet.indexOf(n) < 0 ? '<time>noch frei</time>' : n === d.ich ? '<time>du</time>' : '<button class="pill" data-frei="' + esc(n) + '">Freigeben</button>') + '</div>').join('') +
      '<div class="note">„Freigeben“ löst den Namen vom Telegram-Konto, z.B. nach einem Test.</div></div>' +
      '<button class="danger" id="reset">🔄 Saison zurücksetzen</button><div class="note" style="justify-content:center">Der Endstand wird vorher im Google Sheet gespeichert.</div>' : '') +
    '</main>';
}
function bindRang() {
  document.querySelectorAll('[data-frei]').forEach(b => b.onclick = () => admin('freigeben', { name: b.dataset.frei }, b.dataset.frei + ' freigeben? Danach kann sich jemand neu als ' + b.dataset.frei + ' anmelden.'));
  const r = $('#reset'); if (!r) return;
  r.onclick = () => bestaetigen('Wirklich alle Salden auf 0 setzen? Der Endstand wird gespeichert.',
    () => bestaetigen('Ganz sicher? Das startet eine neue Saison.', () => admin('reset')));
}

load();
setInterval(() => { if (S.d && S.tab === 'lauf') { const y = scrollY; render(); scrollTo(0, y); } }, 60000);
</script>
</body>
</html>
